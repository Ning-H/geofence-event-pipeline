[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofence-pipeline"
version = "0.1.0"
description = "Real-time geofence event pipeline with Kinesis, S3 Parquet, DynamoDB, Athena, and Airflow"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
